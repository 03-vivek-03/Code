[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-rag-security"
version = "0.1.0"
description = "Agentic RAG security research platform: mechanism ablation and trace-based compromise detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vivek Choudhari" }]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
dense = [
    "sentence-transformers>=2.2",
]
api = [
    "openai>=1.30",
]
gbdt = [
    "xgboost>=2.0",
]
dash = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
all = [
    "argus-rag-security[dev,dense,api,gbdt,dash]",
]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "network: tests that require network access",
    "optional: tests requiring optional dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501  line length is handled by the formatter
# B008  function calls in argument defaults are used deliberately for factories
# B905  several zips pair a sequence with its own offset slice, where unequal
#       lengths are the intent rather than a bug
# B027  Attack._prepare is an optional hook, not an abstract method
ignore = ["E501", "B008", "B905", "B027"]
